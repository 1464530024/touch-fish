<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>touch fish 设置</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="titlebar">
    <div class="tb-left">
      <span class="tb-logo"></span>
      <span class="tb-title">touch fish 设置</span>
    </div>
    <div class="tb-controls">
      <button id="btnMin" class="winbtn"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
      <button id="btnMax" class="winbtn"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
      <button id="btnClose" class="winbtn close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
    </div>
  </div>

  <div class="layout">
    <aside class="nav">
      <div class="brand">
        <div class="brand-logo"></div>
        <div>
          <b>touch fish</b>
          <small>摸鱼专用伪装桌面</small>
        </div>
      </div>

      <nav id="navList">
        <button class="nav-item active" data-page="general">
          <span class="ni-ico"><svg viewBox="0 0 16 16"><path d="M8 2.2l1.3.9 1.6-.3.8 1.4 1.5.7v1.7l1.1 1.2-.7 1.5.4 1.6-1.3.9-.6 1.6-1.7.1-1.1 1.2-1.5-.7-1.6.4-.8-1.5-1.6-.6-.1-1.7L2.5 9.6 3.2 8 2.8 6.4 4.2 5.5l.6-1.6 1.7-.1z"/><circle cx="8" cy="7.6" r="2.2" fill="#fff"/></svg></span> 常规
        </button>
        <button class="nav-item" data-page="hotkey">
          <span class="ni-ico"><svg viewBox="0 0 16 16"><rect x="1.2" y="4" width="13.6" height="8" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="3.4" y="6" width="1.6" height="1.6"/><rect x="6.2" y="6" width="1.6" height="1.6"/><rect x="9" y="6" width="1.6" height="1.6"/><rect x="11.4" y="6" width="1.6" height="1.6"/><rect x="5" y="9.2" width="6" height="1.4"/></svg></span> 快捷键
          <em id="navHotkey"></em>
        </button>
        <button class="nav-item" data-page="personalize">
          <span class="ni-ico"><svg viewBox="0 0 16 16"><rect x="1.4" y="2.6" width="13.2" height="9.2" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M1.8 9.8l3.2-3 2.4 2.2 2.2-2.4 3.4 3.2" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="5.2" cy="5.2" r="1.1"/></svg></span> 个性化
        </button>
        <button class="nav-item" data-page="sites">
          <span class="ni-ico"><svg viewBox="0 0 16 16"><path d="M8 1.4l2 4.1 4.5.6-3.3 3.2.8 4.5L8 11.6l-4 2.2.8-4.5L1.5 6.1 6 5.5z"/></svg></span> 网站收藏
        </button>
        <button class="nav-item" data-page="icons">
          <span class="ni-ico"><svg viewBox="0 0 16 16"><rect x="1.6" y="1.6" width="5.4" height="5.4" rx="1"/><rect x="9" y="1.6" width="5.4" height="5.4" rx="1"/><rect x="1.6" y="9" width="5.4" height="5.4" rx="1"/><rect x="9" y="9" width="5.4" height="5.4" rx="1"/></svg></span> 图标库
        </button>
        <button class="nav-item" data-page="tray">
          <span class="ni-ico"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2.4"/></svg></span> 托盘与启动
        </button>
        <button class="nav-item" data-page="about">
          <span class="ni-ico"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="7.3" y="6.8" width="1.5" height="4.4"/><circle cx="8" cy="4.8" r="0.95"/></svg></span> 关于与卸载
        </button>
      </nav>

      <div class="nav-foot">
        <button id="btnEnter" class="primary">进入虚拟桌面</button>
        <div class="hint" id="footHint">连按两次 Ctrl 随时切换</div>
      </div>
    </aside>

    <main id="content"></main>
  </div>

  <div id="toast"></div>
  <script src="settings.js"></script>
</body>
</html>
