<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>桌面</title>
  <link rel="stylesheet" href="desktop.css" />
</head>
<body>
  <div id="wallpaper"></div>

  <!-- 桌面图标区 -->
  <div id="desktop"></div>

  <!-- 窗口层 -->
  <div id="windowLayer"></div>

  <!-- 台球画布 -->
  <canvas id="poolCanvas"></canvas>
  <div id="poolHud" class="hidden">
    <div class="hud-head">
      <span class="hud-dot"></span>
      <span>台球模式</span>
      <span class="hud-score" id="hudScore">进球 0</span>
    </div>
    <div class="hud-tip">长按【此电脑】白球 → 向后拖拽蓄力 → 松开击球。<br />彩球随机散落，黑洞在桌面正中，进洞即得分。</div>
    <div class="hud-actions">
      <button id="hudReset">重新开局</button>
      <button id="hudExit">退出台球</button>
    </div>
  </div>

  <div id="powerWrap">
    <span>击球力度</span>
    <div id="powerBar"><i id="powerFill"></i></div>
  </div>

  <!-- 开始菜单 -->
  <div id="startMenu" class="hidden">
    <div class="sm-left">
      <div class="sm-search">
        <svg viewBox="0 0 16 16" class="sm-search-ico"><path d="M6.8 1.6a5.2 5.2 0 1 1-3.2 9.3l-2 2 .9.9 2-2A5.2 5.2 0 0 1 6.8 1.6zm0 1.2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
        <input id="smSearch" placeholder="搜索应用、文件和设置" />
      </div>
      <div class="sm-scroll">
        <div class="sm-group-title">最近添加</div>
        <div id="smRecent"></div>
        <div class="sm-group-title">全部应用</div>
        <div id="smApps"></div>
      </div>
    </div>
    <div class="sm-right">
      <div class="sm-tiles" id="smTiles"></div>
      <div class="sm-foot">
        <div class="sm-user"><span class="sm-avatar">八</span><span>八哥</span></div>
        <button id="smPower" title="电源">
          <svg viewBox="0 0 24 24"><path d="M11 3h2v9h-2z"/><path d="M7.3 6.2l1.4 1.4A6 6 0 1 0 15.3 7.6l1.4-1.4a8 8 0 1 1-9.4 0z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- 任务栏 -->
  <div id="taskbar">
    <div class="tb-left">
      <button id="startBtn" title="开始">
        <svg viewBox="0 0 20 20" class="winlogo"><path d="M0 3.2l8.2-1.1v8.2H0zM9.4 1.9L20 0v10.3H9.4zM0 11.6h8.2v8.2L0 18.7zM9.4 11.6H20V20l-10.6-1.5z"/></svg>
      </button>
      <div id="searchBox" title="搜索">
        <svg viewBox="0 0 16 16"><path d="M6.8 1.6a5.2 5.2 0 1 1-3.2 9.3l-2 2 .9.9 2-2A5.2 5.2 0 0 1 6.8 1.6zm0 1.2a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
        <span>在此处输入内容进行搜索</span>
      </div>
      <button id="taskViewBtn" title="任务视图">
        <svg viewBox="0 0 24 24"><path d="M3 3h10v10H3zM11 11h10v10H11z"/></svg>
      </button>
    </div>
    <div id="tbApps"></div>
    <div class="tb-right">
      <button id="trayExpand" title="显示隐藏的图标">
        <svg viewBox="0 0 16 16"><path d="M8 4.5l3.5 4h-7z"/></svg>
      </button>
      <div class="tray-icons">
        <span class="tray-ime">中</span>
        <svg viewBox="0 0 20 20" class="tray-ico" title="网络"><path d="M10 15.2a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zM10 9.6c1.9 0 3.6.7 4.9 2l-1.4 1.4A5 5 0 0 0 10 11.6a5 5 0 0 0-3.5 1.4L5.1 11.6A6.9 6.9 0 0 1 10 9.6zm0-5c3.3 0 6.3 1.3 8.5 3.5l-1.4 1.4A10 10 0 0 0 10 6.6 10 10 0 0 0 2.9 9.5L1.5 8.1A12 12 0 0 1 10 4.6z"/></svg>
        <svg viewBox="0 0 20 20" class="tray-ico" title="音量"><path d="M4 8h3l4-3.5v11L7 12H4z"/><path d="M13.5 7a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M15.5 5a7 7 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <svg viewBox="0 0 24 16" class="tray-ico" title="电池"><rect x="1" y="3" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="5" width="13" height="6" rx="1"/><rect x="20" y="6" width="2.5" height="4" rx="1"/></svg>
      </div>
      <div id="clock"><div id="clockTime">14:55</div><div id="clockDate">2026/11/17</div></div>
      <button id="notifyBtn" title="通知">
        <svg viewBox="0 0 24 24"><path d="M12 2a6 6 0 0 1 6 6v5l2 3v1H4v-1l2-3V8a6 6 0 0 1 6-6zm0 20a3 3 0 0 0 3-3H9a3 3 0 0 0 3 3z"/></svg>
      </button>
      <button id="showDesktopBar" title="显示桌面"></button>
      <button id="tfTray" title="touch fish"></button>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div id="ctxMenu" class="hidden"></div>

  <!-- toast -->
  <div id="toast" class="hidden"></div>

  <!-- 触摸鱼托盘菜单 -->
  <div id="tfMenu" class="hidden">
    <div class="tf-head">
      <div class="tf-logo"></div>
      <div>
        <b>touch fish</b>
        <small id="tfStatus">摸鱼模式：已开启</small>
      </div>
    </div>
    <button data-act="hide">返回真实桌面 <kbd id="kbdHotkey">Ctrl Ctrl</kbd></button>
    <button data-act="panic">一键隐藏全部</button>
    <button data-act="pool">台球模式</button>
    <button data-act="busy">忙碌模式（假工作页）</button>
    <button data-act="settings">设置</button>
    <div class="tf-sep"></div>
    <button data-act="quit" class="danger">退出 touch fish</button>
  </div>

  <script src="pool.js"></script>
  <script src="windows.js"></script>
  <script src="app.js"></script>
</body>
</html>
